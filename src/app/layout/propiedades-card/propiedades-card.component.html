<div class="propi-group">
  <div *ngFor="let propiedad of propiedades" class="propi-1">
    <img [src]="propiedad.imagen || 'assets/img/default.jpg'" [alt]="propiedad.titulo || 'Propiedad'">
    <h3>{{ propiedad.titulo || 'Título no disponible' }}</h3>
    <p>{{ propiedad.descripcion || 'Descripción no disponible' }}</p>
    
    <div class="property-actions">
      <a routerLink="/inmuebleinfo" class="btn-2">Más Información</a>
      <button 
        class="favorite-btn"
        (click)="toggleFavorito(propiedad.id)"
        [class.favorited]="esFavorito(propiedad.id)"
        [title]="esFavorito(propiedad.id) ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      >
        <span class="heart-icon">{{ esFavorito(propiedad.id) ? '❤️' : '♡' }}</span>
        {{ esFavorito(propiedad.id) ? 'Quitar' : 'Favorito' }}
      </button>
    </div>
  </div>
</div>
