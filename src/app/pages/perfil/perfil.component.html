<app-navbar></app-navbar>

<section class="login">
  <div class="container">
    <h2>Inicia Sesión en Nobilis</h2>
    <p class="login-desc">
      Accede a tu cuenta para descubrir propiedades exclusivas y servicios personalizados.
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="formulario-login">
      <div class="form-group">
        <input 
          type="email" 
          placeholder="Correo electrónico" 
          formControlName="email"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          <span *ngIf="loginForm.get('email')?.hasError('required')">Correo requerido</span>
          <span *ngIf="loginForm.get('email')?.hasError('email')">Ingresa un correo válido</span>
        </div>
      </div>

      <div class="form-group password-field">
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          placeholder="Contraseña" 
          formControlName="password"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <button 
          type="button" 
          class="toggle-password"
          (click)="togglePasswordVisibility()">
          {{ showPassword ? '👁️' : '👁️‍🗨️' }}
        </button>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          <span *ngIf="loginForm.get('password')?.hasError('required')">Contraseña requerida</span>
          <span *ngIf="loginForm.get('password')?.hasError('minlength')">Mínimo 8 caracteres</span>
        </div>
      </div>

      <button type="submit" class="btn-1" [disabled]="isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading">Cargando...</span>
      </button>
    </form>

    <div class="login-links">
      <a routerLink="/recuperar-contrasena" class="login-link">¿Olvidaste tu contraseña?</a>
      <span> | </span>
      <a routerLink="/registro" class="login-link">Registrarse</a>
    </div>
  </div>
</section>

<app-footer></app-footer>
