<app-navbar></app-navbar>

<section class="login">
  <div class="container">
    <h2>Inicia Sesión en Nobilis</h2>
    <p class="login-desc">
      Accede a tu cuenta para descubrir propiedades exclusivas y servicios personalizados.
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="formulario-login">
      <div class="form-group">
        <input type="email" placeholder="Correo electrónico" formControlName="email" required>
      </div>
      <div class="form-group">
        <input type="password" placeholder="Contraseña" formControlName="password" required>
      </div>
      <button type="submit" class="btn-1">Iniciar Sesión</button>
    </form>

    <div class="login-links">
      <a routerLink="#" class="login-link">¿Olvidaste tu contraseña?</a>
      <span> | </span>
      <a routerLink="/registro" class="login-link">Registrarse</a>
    </div>
  </div>
</section>

<app-footer></app-footer>
