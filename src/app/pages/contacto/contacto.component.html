<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobilis</title>
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    

</head>



<body>
    <app-navbar></app-navbar>

    <section class="contacto">
        <div class="container">
            <h2>Contáctanos</h2>
            <p class="contacto-desc">¿Tienes alguna consulta o deseas más información sobre nuestras propiedades exclusivas? Estamos para ayudarte.</p>
    
            <form class="formulario-contacto">
                <div class="form-group">
                    <input type="text" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <input type="tel" placeholder="Teléfono" required>
                </div>
                <div class="form-group">
                    <textarea placeholder="Mensaje" required></textarea>
                </div>
                <button type="submit" class="btn-1">Enviar Mensaje</button>
            </form>
    
            <div class="registro-rec">
                <p class="registro-recordatorio">
                    Para brindarte una atención aún más personalizada y acceder a beneficios exclusivos, te recomendamos <a href="./registro.html" class="link-registro">registrarte en Nobilis</a>.
                </p>
            </div>
        </div>
    </section>
    
    <app-footer></app-footer>
    
</body>



</html>
