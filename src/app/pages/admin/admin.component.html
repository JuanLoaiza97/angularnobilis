<app-navbar-admin></app-navbar-admin>

<section class="admin-panel">
  <div class="container">
    <h2>Panel de Administración</h2>

    <div class="admin-table">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Ubicación</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let propiedad of propiedades">
            <td>{{ propiedad.titulo }}</td>
            <td>{{ propiedad.ubicacion }}</td>
            <td>{{ propiedad.precio }}</td>
            <td>
              <button (click)="eliminar(propiedad.id)" class="btn-delete">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="admin-actions">
      <a routerLink="/adminadd" class="btn-1">Agregar Nueva Propiedad</a>
    </div>
  </div>
</section>

<app-footer-admin></app-footer-admin>
