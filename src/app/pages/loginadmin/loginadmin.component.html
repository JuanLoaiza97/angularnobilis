<app-navbar></app-navbar>

<section class="login">
  <div class="container">
    <h2>Inicia Sesión como administrador</h2>

    <form class="formulario-login" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input type="email" placeholder="Correo electrónico" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <input type="password" placeholder="Contraseña" [(ngModel)]="password" name="password" required>
      </div>
      <button type="submit" class="btn-1">Iniciar Sesión</button>
    </form>
  </div>
  
</section>

<app-footer></app-footer>
